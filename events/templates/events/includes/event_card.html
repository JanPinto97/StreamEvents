<div class="card h-100 {% if featured %}border-primary shadow{% endif %}">
    {% if event.thumbnail %}
        <img src="{{ event.thumbnail.url }}" class="card-img-top" alt="{{ event.title }}">
    {% endif %}
    <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="badge bg-light text-dark">{{ event.get_category_display }}</span>
            <span class="badge {% if event.status == 'live' %}bg-danger{% elif event.status == 'finished' %}bg-secondary{% else %}bg-success{% endif %}">{{ event.get_status_display }}</span>
        </div>
        <h5 class="card-title">{{ event.title }}</h5>
        <p class="card-text text-muted small mb-2">{{ event.scheduled_date|date:"d/m/Y H:i" }}</p>
        <div class="mt-auto d-flex justify-content-between align-items-center">
            <a href="{% url 'events:event_detail' event.pk %}" class="btn btn-outline-primary btn-sm">Veure</a>
            {% if event.is_featured %}<span class="badge bg-warning text-dark">Destacat</span>{% endif %}
        </div>
    </div>
</div>
