<form method="get" class="card card-body mb-3">
    <div class="row g-2">
        <div class="col-md-3">
            {{ form.search.label_tag }}
            {{ form.search }}
        </div>
        <div class="col-md-3">
            {{ form.category.label_tag }}
            {{ form.category }}
        </div>
        <div class="col-md-3">
            {{ form.status.label_tag }}
            {{ form.status }}
        </div>
        <div class="col-md-3">
            <div class="row g-2">
                <div class="col-6">
                    {{ form.date_from.label_tag }}
                    {{ form.date_from }}
                </div>
                <div class="col-6">
                    {{ form.date_to.label_tag }}
                    {{ form.date_to }}
                </div>
            </div>
        </div>
    </div>
    <div class="mt-3 d-flex justify-content-end">
        <button type="submit" class="btn btn-outline-primary me-2">Filtrar</button>
        <a href="{% url 'events:event_list' %}" class="btn btn-outline-secondary">Netejar</a>
    </div>
</form>
