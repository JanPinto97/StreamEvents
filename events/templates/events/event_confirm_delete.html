{% extends 'base.html' %}
{% block title %}Eliminar {{ event.title }} | StreamEvents{% endblock %}
{% block content %}
<h1 class="h4">Estàs segur que vols eliminar "{{ event.title }}"?</h1>
<p class="text-muted">Aquesta acció no es pot desfer.</p>
<form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'events:event_detail' event.pk %}" class="btn btn-secondary">Cancel·lar</a>
    </div>
</form>
{% endblock %}
